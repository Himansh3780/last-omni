<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Coming Soon | OmniTools</title>
    <meta name="robots" content="noindex, follow"> <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- COPY OF MAIN THEME VARIABLES --- */
        :root { 
            /* LIGHT MODE */
            --bg-body: #ffffff;        
            --bg-card: #ffffff;        
            --border-subtle: #e2e8f0;  
            --primary: #d97706; 
            --primary-dim: rgba(217, 119, 6, 0.1); 
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius-lg: 16px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            /* DARK MODE */
            --bg-body: #050505;        
            --bg-card: #0f0f0f;        
            --border-subtle: rgba(255, 255, 255, 0.08);  
            --primary: #FFD700;       
            --primary-dim: rgba(255, 215, 0, 0.1); 
            --text-main: #ffffff;
            --text-muted: #888888;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg-body); color: var(--text-main);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: background 0.3s; text-align: center; padding: 20px;
        }

        .container { max-width: 600px; width: 100%; }

        .icon-wrapper {
            width: 80px; height: 80px; background: var(--primary-dim); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 30px auto;
            color: var(--primary); font-size: 2rem; box-shadow: 0 0 30px var(--primary-dim);
            animation: pulse 2s infinite;
        }

        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 15px; letter-spacing: -0.03em; }
        p { color: var(--text-muted); font-size: 1.1rem; line-height: 1.6; margin-bottom: 40px; }

        /* Suggestions Grid */
        .suggestions { margin-top: 50px; border-top: 1px solid var(--border-subtle); padding-top: 30px; }
        .suggestions h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 20px; }
        
        .tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; text-align: left; }
        
        .mini-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 15px;
            text-decoration: none; transition: 0.2s;
        }
        .mini-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: var(--shadow); }
        .mini-card i { color: var(--primary); font-size: 1.2rem; width: 30px; text-align: center; }
        .mini-card div { display: flex; flex-direction: column; }
        .mini-card span { color: var(--text-main); font-weight: 700; font-size: 0.9rem; }
        .mini-card small { color: var(--text-muted); font-size: 0.8rem; }

        .home-btn {
            background: var(--text-main); color: var(--bg-body); padding: 12px 30px;
            border-radius: 50px; font-weight: 700; text-decoration: none; transition: 0.2s;
            display: inline-block;
        }
        .home-btn:hover { opacity: 0.9; transform: scale(1.05); }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--primary-dim); } 70% { box-shadow: 0 0 0 20px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-wrapper">
            <i class="fa-solid fa-person-digging"></i>
        </div>
        
        <h1>Under Construction</h1>
        <p>We are currently coding this tool to perfection. <br>Please check back in 24 hours.</p>
        
        <a href="index.html" class="home-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

        <div class="suggestions">
            <h3>Try these Available Tools</h3>
            <div class="tool-grid" id="suggestion-grid">
                </div>
        </div>
    </div>

    <script src="database.js"></script>

    <script>
        // 1. Theme Sync (Check what mode user prefers)
        (function() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();

        // 2. Suggest random tools from Database
        window.addEventListener('load', function() {
            if (typeof toolsDB !== 'undefined' && toolsDB.length > 0) {
                const grid = document.getElementById('suggestion-grid');
                
                // Shuffle and pick 2 random tools
                const randomTools = toolsDB.sort(() => 0.5 - Math.random()).slice(0, 2);
                
                let html = '';
                randomTools.forEach(tool => {
                    html += `
                        <a href="${tool.url}.html" class="mini-card">
                            <i class="fa-solid ${tool.icon}"></i>
                            <div>
                                <span>${tool.name}</span>
                                <small>${tool.desc.substring(0, 40)}...</small>
                            </div>
                        </a>
                    `;
                });
                grid.innerHTML = html;
            }
        });
    </script>

</body>
</html>
